# Common Git hooks for every repository Muse creates.
# Blocks commits and pushes that contain secrets, using gitleaks.
# Requires lefthook and gitleaks on PATH (~/workspace/tools/bin, mirrored to /usr/local/bin).
# After cloning or copying this file into a repo, run: lefthook install

pre-commit:
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --verbose

pre-push:
  commands:
    gitleaks:
      run: gitleaks git --redact --verbose
