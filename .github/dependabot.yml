# Dependabot: keep dependencies current, with the ecosystem grouped
# into a single pull request so updates arrive as one reviewable
# change instead of a stream of separate PRs.
#
# Cadence: Dependabot's finest schedule interval is daily, so the
# "every few days" feel is created with cooldown: versions younger
# than 3 days are never proposed. (Dependabot rejects semver-*
# cooldown options for the github-actions ecosystem, and one
# unsupported property invalidates the whole file, so no
# semver-major-days is set here.)
#
# Nix note: Dependabot has no Nix ecosystem. flake.lock updates are
# handled by the scheduled update-flake-lock workflow instead
# (.github/workflows/update-flake-lock.yml).
#
# gh-share exception: gh-share's canonical version is the require in
# gh-share/go.mod (Go tools pattern), so the gomod ecosystem below
# opens its update PRs. The matching pin in flake.nix is not covered
# by Dependabot and must be bumped to the same version before such a
# PR is merged; CI's gh-share job fails while the two disagree.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/gh-share"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      gomod:
        patterns:
          - "*"
